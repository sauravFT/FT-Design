<!doctype html>
<!-- @dsCard group="UI Kit — Mobile App" name="Mobile app — UI kit" subtitle="Interactive iOS money app: onboarding → send" viewport="470x600" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaV Mobile — UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  *,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--surface-ios); color: var(--fg); -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 32px 16px 56px; gap: 22px; }
  .kit-head { text-align: center; max-width: 440px; }
  .kit-head .mark { width: 34px; height: 34px; border-radius: 0; background: var(--primary); display: inline-grid; place-items: center; margin-bottom: 10px; }
  .kit-head h1 { font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
  .kit-head p { font-size: 13px; color: var(--fg-muted); margin-top: 4px; line-height: 1.5; }
  .rail { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .rail button { font-family: var(--font-body); font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 0; border: 1px solid var(--border-input); background: #fff; color: var(--fg-muted); cursor: pointer; transition: .12s; }
  .rail button.on { background: var(--primary); border-color: var(--primary); color: #fff; }
  .reset { font-size: 11px; color: var(--fg-muted); cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
  <div class="kit-head">
    <div class="mark"><svg width="18" height="18" viewBox="0 0 20 20" fill="#fff"><rect x="2" y="2" width="7" height="7" rx="2"/><rect x="11" y="2" width="7" height="7" rx="2"/><rect x="2" y="11" width="7" height="7" rx="2"/><rect x="11" y="11" width="7" height="7" rx="2" opacity=".4"/></svg></div>
    <h1>MaV Mobile — Money App</h1>
    <p>Interactive iOS recreation. Tap through onboarding → login → OTP → home, then send money. Jump to any screen below.</p>
  </div>
  <div class="rail" id="rail"></div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="Icons.jsx"></script>
  <script type="text/babel" src="Primitives.jsx"></script>
  <script type="text/babel" src="ScreensAuth.jsx"></script>
  <script type="text/babel" src="ScreensApp.jsx"></script>
  <script type="text/babel">
    const { useState } = React;
    const STEPS = [
      { k: 'onboarding', label: 'Onboarding' },
      { k: 'login', label: 'Login' },
      { k: 'otp', label: 'OTP' },
      { k: 'home', label: 'Home' },
      { k: 'send', label: 'Send' },
    ];

    function App() {
      const [screen, setScreen] = useState('onboarding');
      const [success, setSuccess] = useState(false);
      const [lastAmount, setLastAmount] = useState('20,000');
      const balance = '284,500';

      const go = (s) => { setSuccess(false); setScreen(s); };

      const onAction = (k) => { if (k === 'send') go('send'); };

      let view;
      if (screen === 'onboarding') view = <Onboarding onNext={() => go('login')} onLogin={() => go('login')} />;
      else if (screen === 'login') view = <PhoneLogin onContinue={() => go('otp')} />;
      else if (screen === 'otp') view = <OTPVerify onVerify={() => go('home')} onBack={() => go('login')} />;
      else if (screen === 'home') view = <Home onNav={() => {}} onAction={onAction} balance={balance} />;
      else if (screen === 'send') view = <Send balance={balance} onBack={() => go('home')} onDone={() => setSuccess(true)} />;

      return (
        <>
          <div className="rail">
            {STEPS.map(s => <button key={s.k} className={screen === s.k ? 'on' : ''} onClick={() => go(s.k)}>{s.label}</button>)}
          </div>
          <div style={{ position: 'relative' }}>
            <PhoneFrame>
              {view}
              {success && <SuccessOverlay amount={lastAmount} onDone={() => go('home')} />}
            </PhoneFrame>
          </div>
        </>
      );
    }

    // mount rail inside App; remove static rail placeholder
    document.getElementById('rail').remove();
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
