<!doctype html>
<!-- @dsCard group="Components" name="Toggles & checkboxes" subtitle="On/off states" viewport="700x190" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
.row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.cap{font-size:9px;color:var(--fg-muted);font-family:var(--font-mono);width:64px}
.tog{width:46px;height:26px;border-radius:9999px;position:relative;flex-shrink:0}
.tog .k{position:absolute;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.tog.on{background:var(--primary)}.tog.on .k{left:23px}
.tog.off{background:var(--bg-secondary)}.tog.off .k{left:3px}
.cb{width:22px;height:22px;border-radius:0;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cb.on{background:var(--primary);color:#fff;font-size:13px;font-weight:700}
.cb.off{background:#fff;border:1.5px solid var(--border-input)}
.lab{font-size:13px;font-weight:500}
</style>
</head><body>
<div class="eyebrow">Controls · toggle + checkbox</div>
<div class="row"><span class="cap">toggle</span><div class="tog on"><div class="k"></div></div><span class="lab">Face ID enabled</span></div>
<div class="row"><span class="cap"></span><div class="tog off"><div class="k"></div></div><span class="lab" style="color:var(--fg-muted)">Email receipts</span></div>
<div class="row"><span class="cap">checkbox</span><div class="cb on">✓</div><span class="lab">I agree to the terms</span><div class="cb off" style="margin-left:8px"></div><span class="lab" style="color:var(--fg-muted)">Save card</span></div>
</body></html>
