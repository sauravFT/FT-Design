<!doctype html>
<!-- @dsCard group="Colors" name="Themes" subtitle="Dark hero now magenta; neon stays lime + cyan" viewport="700x190" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
.themes{display:flex;gap:10px}
.tdemo{flex:1;border-radius:0;overflow:hidden;border:1px solid var(--border)}
.tbar{padding:10px 12px;font-size:11px;font-weight:700}
.tbody{padding:12px;display:flex;flex-direction:column;gap:8px}
.tbtn{padding:8px;border-radius:0;font-size:11px;font-weight:600;text-align:center}
.tchip{font-size:10px;font-weight:600;padding:3px 8px;border-radius:0;align-self:flex-start}
</style>
</head><body>
<div class="eyebrow">Themes · light → dark (the brand accent flips blue → magenta)</div>
<div class="themes">
  <div class="tdemo" style="background:#fff">
    <div class="tbar" style="color:#171717">Light · #FFFFFF</div>
    <div class="tbody"><div class="tbtn" style="background:#352eff;color:#fff">Primary #352EFF</div><div class="tchip" style="background:#352eff1a;color:#352eff">balance</div></div>
  </div>
  <div class="tdemo" style="background:#171717;border-color:#484848">
    <div class="tbar" style="color:#fff">Dark · #171717</div>
    <div class="tbody"><div class="tbtn" style="background:transparent;border:1.5px solid #ff00ff;color:#ff00ff">Outline #FF00FF</div><div class="tchip" style="background:#ff00ff1a;color:#ff00ff">balance</div></div>
  </div>
</div>
</body></html>
