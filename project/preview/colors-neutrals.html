<!doctype html>
<!-- @dsCard group="Colors" name="Neutral ramp" subtitle="9-step mono scale on near-black ink" viewport="700x210" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>.ramp{display:flex;gap:0;border-radius:10px;overflow:hidden;border:1px solid var(--border)}.ramp>div{flex:1;height:48px}.lbls{display:flex;margin-top:6px}.lbls>span{flex:1;text-align:center;font-size:9px;color:var(--fg-muted);font-family:var(--font-mono)}</style>
</head><body>
<div class="eyebrow">Neutrals · mono ramp (near-black #171717, never pure black)</div>
<div class="ramp">
  <div style="background:#e5e5e5"></div><div style="background:#cccccc"></div>
  <div style="background:#b2b2b2"></div><div style="background:#999999"></div>
  <div style="background:#7f7f7f"></div><div style="background:#666666"></div>
  <div style="background:#4c4c4c"></div><div style="background:#333333"></div>
  <div style="background:#191919"></div>
</div>
<div class="lbls"><span>100</span><span>200</span><span>300</span><span>400</span><span>500</span><span>600</span><span>700</span><span>800</span><span>900</span></div>
<div class="card-row" style="margin-top:14px">
  <div class="sw"><div class="sw-c" style="background:#171717"></div><div class="sw-meta"><div class="sw-name">Ink / fg</div><div class="sw-hex">#171717</div></div></div>
  <div class="sw"><div class="sw-c" style="background:#7f7f7f"></div><div class="sw-meta"><div class="sw-name">Muted</div><div class="sw-hex">#7F7F7F</div></div></div>
  <div class="sw"><div class="sw-c" style="background:#efefef"></div><div class="sw-meta"><div class="sw-name">Border</div><div class="sw-hex">#EFEFEF</div></div></div>
  <div class="sw"><div class="sw-c" style="background:#ffffff"></div><div class="sw-meta"><div class="sw-name">Surface</div><div class="sw-hex">#FFFFFF</div></div></div>
</div>
</body></html>
