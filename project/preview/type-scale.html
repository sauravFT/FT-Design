<!doctype html>
<!-- @dsCard group="Type" name="Type scale" subtitle="FT Sans — hero to caption" viewport="700x300" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
.row{display:flex;align-items:baseline;gap:18px;padding:9px 0;border-bottom:1px solid var(--border)}
.row:last-child{border:none}
.meta{min-width:118px;flex-shrink:0}
.meta .l{font-size:11px;font-weight:600}
.meta .s{font-size:10px;color:var(--fg-muted);font-family:var(--font-mono)}
.spec{color:var(--fg);letter-spacing:-.02em}
</style>
</head><body>
<div class="eyebrow">Type scale · FT Sans</div>
<div class="row"><div class="meta"><div class="l">Hero</div><div class="s">48 / 800</div></div><div class="spec" style="font-size:42px;font-weight:800;line-height:1">Send money</div></div>
<div class="row"><div class="meta"><div class="l">Heading</div><div class="s">32 / 700</div></div><div class="spec" style="font-size:30px;font-weight:700">Available balance</div></div>
<div class="row"><div class="meta"><div class="l">Title</div><div class="s">20 / 700</div></div><div class="spec" style="font-size:20px;font-weight:700">Recent transactions</div></div>
<div class="row"><div class="meta"><div class="l">Body</div><div class="s">14 / 400</div></div><div class="spec" style="font-size:14px;font-weight:400;letter-spacing:0">Transfer to anyone, anywhere — just tap and it's done.</div></div>
<div class="row"><div class="meta"><div class="l">Caption</div><div class="s">12 / 400</div></div><div class="spec" style="font-size:12px;font-weight:400;color:var(--fg-muted);letter-spacing:0">Last updated: just now</div></div>
</body></html>
