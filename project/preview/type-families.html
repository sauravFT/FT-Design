<!doctype html>
<!-- @dsCard group="Type" name="Font family" subtitle="FT Sans — the single brand UI typeface" viewport="700x175" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
.spec{display:flex;gap:18px;align-items:center}
.big{font-family:var(--font-ft);font-weight:600;font-size:72px;letter-spacing:-.03em;line-height:.9}
.body{flex:1}
.tag{display:inline-block;white-space:nowrap;font-size:9px;font-weight:700;color:var(--primary);font-family:var(--font-mono);background:var(--primary-soft);padding:3px 8px;border-radius:9999px;margin-bottom:8px}
.alpha{font-family:var(--font-ft);font-size:15px;line-height:1.7;color:var(--fg)}
.alpha .dim{color:var(--fg-muted)}
</style>
</head><body>
<div class="eyebrow">Brand typeface · FT Sans is the only UI face</div>
<div class="spec">
  <div class="big">Aa</div>
  <div class="body">
    <span class="tag">FT Sans · self-hosted · 300–600</span>
    <div class="alpha">ABCDEFGHIJKLMNOPQRSTUVWXYZ<br><span class="dim">abcdefghijklmnopqrstuvwxyz</span><br><span class="dim">0123456789 &nbsp; ₦ $ % &amp; @ — →</span></div>
  </div>
</div>
</body></html>
