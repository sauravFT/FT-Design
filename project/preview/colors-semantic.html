<!doctype html>
<!-- @dsCard group="Colors" name="Semantic colors" subtitle="Success / danger / warning / info + soft fills" viewport="700x130" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>.pair{flex:1;border-radius:10px;overflow:hidden;border:1px solid var(--border)}.pair .solid{height:40px;display:flex;align-items:center;padding:0 12px;color:#fff;font-size:12px;font-weight:700}.pair .soft{height:24px;display:flex;align-items:center;padding:0 12px;font-size:10px;font-weight:600}</style>
</head><body>
<div class="eyebrow">Semantic · solid + 10% soft fill</div>
<div class="card-row">
  <div class="pair"><div class="solid" style="background:#629c28">Success</div><div class="soft" style="background:#629c281a;color:#629c28">#629C28</div></div>
  <div class="pair"><div class="solid" style="background:#ff0000">Danger</div><div class="soft" style="background:#ff00001a;color:#ff0000">#FF0000</div></div>
  <div class="pair"><div class="solid" style="background:#ff8400">Warning</div><div class="soft" style="background:#ff84001a;color:#ff8400">#FF8400</div></div>
  <div class="pair"><div class="solid" style="background:#144cc7">Info</div><div class="soft" style="background:#144cc71a;color:#144cc7">#144CC7</div></div>
</div>
</body></html>
