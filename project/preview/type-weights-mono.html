<!doctype html>
<!-- @dsCard group="Type" name="Weights & mono" subtitle="FT Sans 300–600 + JetBrains Mono" viewport="700x260" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
.wrow{display:flex;align-items:center;gap:16px;padding:7px 0;border-bottom:1px solid var(--border)}
.wrow:last-child{border:none}
.wm{min-width:118px;font-size:10px;color:var(--fg-muted);font-family:var(--font-mono)}
.ws{font-size:19px;color:var(--fg)}
.mono-box{margin-top:14px;background:#0d0d0d;border-radius:8px;padding:12px 14px;font-family:var(--font-mono);font-size:13px;color:#ff00ff}
.mono-box .c{color:#7c9dff}
</style>
</head><body>
<div class="eyebrow">FT Sans weights · 300–600 (700/800 render at SemiBold)</div>
<div class="wrow"><div class="wm">300 · Light</div><div class="ws" style="font-weight:300">Send money in seconds</div></div>
<div class="wrow"><div class="wm">400 · Regular</div><div class="ws" style="font-weight:400">Send money in seconds</div></div>
<div class="wrow"><div class="wm">500 · Medium</div><div class="ws" style="font-weight:500">Send money in seconds</div></div>
<div class="wrow"><div class="wm">600 · Semi Bold</div><div class="ws" style="font-weight:600">Send money in seconds</div></div>
<div class="mono-box"><span class="c">// JetBrains Mono — fixed: code, tokens, money</span><br>--primary: #352eff;  <span class="c">₦ 284,500.00</span></div>
</body></html>
