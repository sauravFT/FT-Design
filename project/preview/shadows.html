<!doctype html>
<!-- @dsCard group="Spacing" name="Elevation" subtitle="Soft layered shadows + brand glow" viewport="700x160" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
body{background:var(--surface-soft)}
.el{flex:1;display:flex;flex-direction:column;align-items:center;gap:9px}
.el .box{width:100%;height:60px;background:#fff;border-radius:0}
.el .t{font-size:10px;font-weight:600}
.el .v{font-size:9px;color:var(--fg-muted);font-family:var(--font-mono)}
</style>
</head><body>
<div class="eyebrow">Elevation · soft, layered, near-black tint (never harsh)</div>
<div class="card-row" style="margin-top:4px">
  <div class="el"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="t">xs</div></div>
  <div class="el"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="t">sm</div></div>
  <div class="el"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="t">md</div></div>
  <div class="el"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="t">lg</div></div>
  <div class="el"><div class="box" style="box-shadow:var(--shadow-brand);background:var(--gradient-brand)"></div><div class="t">brand glow</div></div>
</div>
</body></html>
