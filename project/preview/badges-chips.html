<!doctype html>
<!-- @dsCard group="Components" name="Badges & chips" subtitle="Solid / soft / outline, fully round" viewport="700x200" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
.b{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 10px;border-radius:9999px;font:600 11px var(--font-body)}
.grp{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.cap{font-size:9px;color:var(--fg-muted);font-family:var(--font-mono);width:64px}
</style>
</head><body>
<div class="eyebrow">Badges & chips · fully round</div>
<div class="grp"><span class="cap">solid</span>
  <span class="b" style="background:var(--primary);color:#fff">Primary</span>
  <span class="b" style="background:var(--bg-secondary);color:var(--fg)">Default</span>
</div>
<div class="grp"><span class="cap">soft</span>
  <span class="b" style="background:var(--success-soft);color:var(--success)">Credit</span>
  <span class="b" style="background:var(--danger-soft);color:var(--danger)">Failed</span>
  <span class="b" style="background:var(--warning-soft);color:var(--warning)">Pending</span>
  <span class="b" style="background:var(--primary-soft);color:var(--primary)">New</span>
</div>
<div class="grp"><span class="cap">outline</span>
  <span class="b" style="background:transparent;border:1px solid var(--success);color:var(--success)">Active</span>
  <span class="b" style="background:transparent;border:1px solid var(--border-input);color:var(--fg-muted)">Draft</span>
</div>
</body></html>
