<!doctype html>
<!-- @dsCard group="Components" name="Transaction rows" subtitle="Icon tile + meta + mono value" viewport="700x220" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
.txn{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}
.txn:last-child{border:none}
.ic{width:40px;height:40px;border-radius:0;background:var(--bg-secondary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.bd{flex:1}
.nm{font-size:14px;font-weight:600}
.mt{font-size:12px;color:var(--fg-muted);margin-top:1px}
.rt{text-align:right}
.am{font:700 15px var(--font-mono)}
.cr{color:var(--success)}.db{color:var(--danger)}
.st{font-size:11px;color:var(--fg-muted);margin-top:1px}
</style>
</head><body>
<div class="eyebrow">Transaction rows · icon tile + meta + mono value</div>
<div class="txn"><div class="ic"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M14 6L6 14M11 14H6V9" stroke="var(--success)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="bd"><div class="nm">Salary — GTBank</div><div class="mt">Transfer · Today, 09:14</div></div><div class="rt"><div class="am cr">+₦ 350,000</div><div class="st">Credit</div></div></div>
<div class="txn"><div class="ic"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M6 14L14 6M9 6H14V11" stroke="var(--danger)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="bd"><div class="nm">Airtime — MTN</div><div class="mt">Bill payment · Today, 11:45</div></div><div class="rt"><div class="am db">−₦ 2,000</div><div class="st">Debit</div></div></div>
<div class="txn"><div class="ic"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M6 14L14 6M9 6H14V11" stroke="var(--danger)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="bd"><div class="nm">P2P — James K.</div><div class="mt">Send money · Yesterday</div></div><div class="rt"><div class="am db">−₦ 20,000</div><div class="st">Pending</div></div></div>
</body></html>
