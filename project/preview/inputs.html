<!doctype html>
<!-- @dsCard group="Components" name="Input fields" subtitle="Default → focus → error" viewport="700x210" -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
.fl{font-size:12px;font-weight:600;margin-bottom:6px;display:block}
.inp{width:100%;height:48px;padding:0 4px;border-radius:0;border:none;border-bottom:2px solid var(--mono-400);font:400 14px var(--font-body);color:var(--fg);background:transparent;outline:none}
.inp::placeholder{color:var(--fg-placeholder)}
.inp.focus{border-bottom-color:var(--primary)}
.inp.err{border-bottom-color:var(--danger)}
.g{margin-bottom:14px}
.col{display:flex;gap:12px}
.col>div{flex:1}
.hint{font-size:11px;color:var(--danger);margin-top:5px}
</style>
</head><body>
<div class="eyebrow">Input fields · default → focus → error</div>
<div class="col">
  <div class="g"><label class="fl">Default</label><input class="inp" placeholder="Enter amount…" value=""></div>
  <div class="g"><label class="fl">Focus</label><input class="inp focus" value="James K."></div>
</div>
<div class="g"><label class="fl">Error</label><input class="inp err" value="123"><div class="hint">Enter a valid account number</div></div>
</body></html>
